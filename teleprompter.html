<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="css/teleprompter.css">
</head>
<body>
  <div id="masterIdleBorder" aria-hidden="true"></div>
  <div id="contextHeader">
    <span id="headerAct">Act —</span>
    <span id="headerScene">Scene —</span>
    <span id="headerPage">Page —</span>
  </div>

  <div id="overviewRail" title="Script overview">
    <div id="overviewMarkers"></div>
    <div id="overviewViewportIndicator"></div>
    <div id="overviewMasterIndicator" class="overview-mark master-position" hidden></div>
  </div>

  <div id="toolbar">
    <button id="playPauseBtn" class="icon-btn" title="Play / Pause" aria-label="Play / Pause">▶</button>
    <button id="backBtn" class="icon-btn" title="Back one third page" aria-label="Back one third page">↶</button>
    <button id="slowerBtn" class="icon-btn" title="Slower" aria-label="Slower">−</button>
    <button id="fasterBtn" class="icon-btn" title="Faster" aria-label="Faster">+</button>
    <button id="topBtn" class="icon-btn" title="Jump to top" aria-label="Jump to top">⇱</button>
    <button id="bottomBtn" class="icon-btn" title="Jump to bottom" aria-label="Jump to bottom">⇲</button>
    <button id="fullscreenBtn" class="icon-btn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    <button id="wakeLockBtn" class="icon-btn" title="Keep screen awake" aria-label="Keep screen awake">☀</button>
    <button id="stageDirectionsBtn" class="icon-btn" title="Show stage directions" aria-label="Show stage directions">SD</button>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    <button id="exportBtn" class="icon-btn" title="Export marked-up script to PDF" aria-label="Export PDF">PDF</button>

    <select id="scriptSelect" title="Choose script" aria-label="Choose script">
      <option value="">Script…</option>
    </select>

    <select id="sceneSelect" title="Jump to scene" aria-label="Jump to scene">
      <option value="">Scene…</option>
    </select>

    <select id="songSelect" title="Jump to song" aria-label="Jump to song">
      <option value="">Song…</option>
    </select>


    <span id="deptLabel">ASM</span>
    <button id="masterBtn" class="icon-btn" title="Become master" aria-label="Become master">🔒</button>
    <button id="addCueBtn" class="icon-btn" title="Add cue at current position" aria-label="Add cue" hidden>＋C</button>
    <button id="annotateBtn" class="icon-btn" title="Draw script annotations" aria-label="Draw script annotations" hidden>✎</button>
    <button id="nextCueBtn" class="icon-btn" title="Jump to next cue" aria-label="Jump to next cue" hidden>↓C</button>
    <button id="rejoinBtn" class="icon-btn" title="Rejoin master position" aria-label="Rejoin master position">◎</button>

    <div id="passwordPanel" class="password-panel" hidden>
      <input id="masterPassword" type="password" autocomplete="current-password"
             placeholder="Password" aria-label="Unlock password">
      <button id="masterLoginBtn" title="Unlock">Unlock</button>
      <button id="takeControlBtn" title="Take master control" hidden>Take control</button>
      <button id="masterCancelBtn" class="icon-btn" title="Cancel" aria-label="Cancel">✕</button>
    </div>

    <div id="syncStatus">FOLLOW: connecting…</div>
    <div id="masterHealthStatus" title="Master/server heartbeat and time since ASM interaction"></div>


    <span id="speedControl">
      <label for="speedInput">Speed</label>
      <input id="speedInput" type="range" min="0" max="20" step="0.1" value="2.0">
    </span>

    <label for="fontSizeInput">Font</label>
    <input id="fontSizeInput" type="range" min="16" max="180" step="1" value="42">

    <div id="status">Paused | Speed: 2.0</div>
  </div>

  <div id="annotationTools" hidden>
    <button type="button" data-ann-tool="pen" title="Freehand pen" aria-label="Freehand pen">🖊</button>
    <button type="button" data-ann-tool="arrow" title="Arrow" aria-label="Arrow">➜</button>
    <button type="button" data-ann-tool="ellipse" title="Circle / ellipse" aria-label="Circle or ellipse">○</button>
    <button type="button" data-ann-tool="text" title="Text note" aria-label="Text note">T</button>
    <button type="button" data-ann-tool="erase" title="Erase annotation" aria-label="Erase annotation">⌫</button>
    <button type="button" id="annotationUndoBtn" title="Undo last annotation change" aria-label="Undo last annotation change">↶</button>
    <input id="annotationColor" type="color" value="#ffd000" title="Annotation colour" aria-label="Annotation colour">
    <input id="annotationWidth" type="range" min="1" max="10" step="0.5" value="3" title="Line width" aria-label="Annotation line width">
    <span id="annotationSyncStatus"></span>
    <button type="button" id="annotationDoneBtn" title="Finish annotating" aria-label="Finish annotating">✓</button>
  </div>

  <div id="settingsBackdrop" hidden></div>
  <div id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <h3 id="settingsTitle">Settings</h3>
    <div class="settings-row">
      <label for="railSideSelect">Overview rail</label>
      <select id="railSideSelect">
        <option value="right">Right</option>
        <option value="left">Left</option>
      </select>
    </div>
    <div id="settingsMarginControls">
      <div class="settings-row">
        <label for="annotationMarginSideSelect">Department annotation margin</label>
        <select id="annotationMarginSideSelect">
          <option value="none">None</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="annotationMarginWidth">Margin width</label>
        <div>
          <input id="annotationMarginWidth" type="range" min="0" max="40" step="1" value="0">
          <span id="annotationMarginWidthValue">0%</span>
        </div>
      </div>
    </div>
    <div id="settingsActions">
      <span id="settingsSaveStatus" role="status"></span>
      <button id="settingsDoneBtn" type="button">Done</button>
    </div>
  </div>

  <div id="exportBackdrop" hidden></div>
  <div id="exportPanel" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
    <h3 id="exportTitle">Export marked-up script</h3>
    <div class="export-row">
      <label for="exportDepartment">Cues / annotations</label>
      <select id="exportDepartment">
        <option value="ALL">All departments</option>
        <option value="FS">FS</option>
        <option value="LX">LX</option>
        <option value="SND">SND</option>
        <option value="STG">STG</option>
        <option value="NONE">Script only</option>
      </select>
    </div>
    <div class="export-row">
      <label for="exportStageDirections">Stage directions</label>
      <select id="exportStageDirections">
        <option value="all">Show all</option>
        <option value="relevant">Relevant to selected cues</option>
        <option value="hide">Hide</option>
      </select>
    </div>
    <div class="export-row">
      <label for="exportCues">Cue markers</label>
      <input id="exportCues" type="checkbox" checked>
    </div>
    <div class="export-row">
      <label for="exportAnnotations">Annotations</label>
      <input id="exportAnnotations" type="checkbox" checked>
    </div>
    <div id="exportActions">
      <span id="exportStatus" role="status"></span>
      <span class="spacer"></span>
      <button id="exportCancelBtn" type="button">Cancel</button>
      <button id="exportOpenBtn" type="button">Open print / PDF view</button>
    </div>
  </div>

  <div id="cueEditorPanel" hidden>
    <h3 id="cueEditorTitle">Add Cue</h3>
    <div class="cue-form-row">
      <label for="cueNumber">Cue</label>
      <input id="cueNumber" type="text" maxlength="24" placeholder="e.g. 12">
    </div>
    <div class="cue-form-row">
      <label for="cueDescription">Description</label>
      <input id="cueDescription" type="text" maxlength="120" placeholder="e.g. Pick up Chaplin">
    </div>
    <div class="cue-form-row">
      <label for="cueColor">Colour</label>
      <input id="cueColor" type="color" value="#ffd000">
    </div>
    <div class="cue-form-row">
      <label>Anchor</label>
      <span id="cueAnchorInfo"></span>
    </div>
    <div class="cue-form-row" id="cueWordRow" hidden>
      <label>Trigger</label>
      <button id="cueChooseWordBtn" type="button">Choose trigger word</button>
      <span id="cueWordInfo"></span>
    </div>
    <div class="cue-form-row buttons">
      <label>End</label>
      <button id="cueUseEndCurrentBtn" type="button">Choose end position</button>
      <button id="cueClearEndBtn" type="button">Clear end</button>
      <span id="cueEndInfo">No end position</span>
    </div>
    <div id="cueEditorError"></div>
    <div id="cueEditorActions">
      <button id="cueUseCurrentBtn">Change start position</button>
      <button id="cueDeleteBtn" hidden>Delete</button>
      <button id="cueCancelBtn">Cancel</button>
      <button id="cueSaveBtn">Save</button>
    </div>
  </div>

  <div id="viewport">
    <div id="content"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
